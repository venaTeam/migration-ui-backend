# Tests run on merge requests and branch pushes. On the default branch, on dev
# and on tags, the image is also built and pushed to Artifactory.
#
# CI/CD variables to set in GitLab (Settings > CI/CD > Variables):
#   REGISTRY_USER, REGISTRY_PASSWORD  Artifactory push credentials (masked)
#   PIP_INDEX_URL                     PyPI mirror, when the runner can't reach pypi.org
#   PYTHON_IMAGE, KANIKO_IMAGE        mirrored copies of the job images, if needed
#   KANIKO_EXTRA_ARGS                 e.g. --registry-mirror=<mirror> for the Dockerfile's base image

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A branch with an open MR runs in the MR pipeline instead, except the
    # branches that publish images.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BRANCH != "dev"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  PYTHON_IMAGE: python:3.12-slim
  KANIKO_IMAGE: gcr.io/kaniko-project/executor:v1.23.2-debug
  REGISTRY: 8200artifactory.d8200.mil/docker-images-local/vena/alerts-migration/alerts-migration
  IMAGE_NAME: migration-ui-backend
  KANIKO_EXTRA_ARGS: ""
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip

stages:
  - test
  - image

test:
  stage: test
  image: $PYTHON_IMAGE
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .cache/pip
  script:
    - pip install -r requirements.txt
    - ruff check app tests
    - mypy app tests
    - pytest -q

image:
  stage: image
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        IMAGE_TAG: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        IMAGE_TAG: $CI_COMMIT_SHORT_SHA
    - if: $CI_COMMIT_BRANCH == "dev"
      variables:
        IMAGE_TAG: dev-$CI_COMMIT_SHORT_SHA
  script:
    - mkdir -p /kaniko/.docker
    - AUTH=$(printf '%s:%s' "$REGISTRY_USER" "$REGISTRY_PASSWORD" | base64 | tr -d '\n')
    - echo "{\"auths\":{\"${REGISTRY%%/*}\":{\"auth\":\"$AUTH\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
      ${PIP_INDEX_URL:+--build-arg PIP_INDEX_URL=$PIP_INDEX_URL}
      $KANIKO_EXTRA_ARGS
