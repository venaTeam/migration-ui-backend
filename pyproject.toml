# Tool configuration only; dependencies are in requirements.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
# Starlette's TestClient now prefers the httpx2 package; httpx still works.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "N"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
